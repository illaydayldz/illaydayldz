<text x="48" y="54" font-size="26" font-style="italic" font-weight="700" fill="#8b5cf6" font-family="Georgia,serif">ilaydayldz</text><text x="48" y="124" font-size="32" font-weight="700" fill="#ffffff">Hi, I'm İlayda.</text><text x="48" y="152" font-size="15" font-weight="600" fill="#a78bfa">Actuary by profession, builder by curiosity.</text><text x="48" y="186" font-size="13.5" fill="#bdbdc7"><tspan x="48" dy="0">I&#x27;m an actuary who codes. I work in insurance, and in my free</tspan><tspan x="48" dy="19">time I build things with Python and JavaScript.</tspan></text><text x="48" y="236" font-size="13.5" fill="#bdbdc7"><tspan x="48" dy="0">It started with Python, machine learning notebooks and Codewars</tspan><tspan x="48" dy="19">katas, and turned into real web apps for me and my friends: an</tspan><tspan x="48" dy="19">exam-prep app for future actuaries and an English learning app.</tspan></text><text x="48" y="305" font-size="13.5" fill="#bdbdc7"><tspan x="48" dy="0">I also do design, so I care about how my apps look and feel, not</tspan><tspan x="48" dy="19">just how they work.</tspan></text><text x="48" y="355" font-size="13.5" fill="#bdbdc7"><tspan x="48" dy="0">Right now I&#x27;m going deeper into machine learning while I keep</tspan><tspan x="48" dy="19">shipping and improving my apps.</tspan></text><rect x="48" y="411" width="71" height="28" rx="14" fill="#1a1328"/><text x="83.5" y="430" font-size="12" fill="#a78bfa" text-anchor="middle" font-weight="600">Python</text><rect x="127" y="411" width="35" height="28" rx="14" fill="#1a1328"/><text x="144.5" y="430" font-size="12" fill="#a78bfa" text-anchor="middle" font-weight="600">R</text><rect x="170" y="411" width="49" height="28" rx="14" fill="#1a1328"/><text x="194.5" y="430" font-size="12" fill="#a78bfa" text-anchor="middle" font-weight="600">SQL</text><rect x="227" y="411" width="85" height="28" rx="14" fill="#1a1328"/><text x="269.5" y="430" font-size="12" fill="#a78bfa" text-anchor="middle" font-weight="600">Power BI</text><rect x="320" y="411" width="143" height="28" rx="14" fill="#1a1328"/><text x="391.5" y="430" font-size="12" fill="#a78bfa" text-anchor="middle" font-weight="600">Machine Learning</text><rect x="48" y="447" width="100" height="28" rx="14" fill="#1a1328"/><text x="98.0" y="466" font-size="12" fill="#a78bfa" text-anchor="middle" font-weight="600">JavaScript</text><rect x="156" y="447" width="71" height="28" rx="14" fill="#1a1328"/><text x="191.5" y="466" font-size="12" fill="#a78bfa" text-anchor="middle" font-weight="600">Design</text><g class="bob"><rect x="637" y="130" width="13" height="13" fill="#8b5cf6"/><rect x="741" y="130" width="13" height="13" fill="#8b5cf6"/><rect x="624" y="143" width="13" height="13" fill="#8b5cf6"/><rect x="637" y="143" width="13" height="13" fill="#8b5cf6"/><rect x="728" y="143" width="13" height="13" fill="#8b5cf6"/><rect x="741" y="143" width="13" height="13" fill="#8b5cf6"/><rect x="624" y="156" width="13" height="13" fill="#8b5cf6"/><rect x="637" y="156" width="13" height="13" fill="#8b5cf6"/><rect x="650" y="156" width="13" height="13" fill="#8b5cf6"/><rect x="715" y="156" width="13" height="13" fill="#8b5cf6"/><rect x="728" y="156" width="13" height="13" fill="#8b5cf6"/><rect x="741" y="156" width="13" height="13" fill="#8b5cf6"/><rect x="611" y="169" width="13" height="13" fill="#8b5cf6"/><rect x="624" y="169" width="13" height="13" fill="#8b5cf6"/><rect x="637" y="169" width="13" height="13" fill="#8b5cf6"/><rect x="650" y="169" width="13" height="13" fill="#8b5cf6"/><rect x="663" y="169" width="13" height="13" fill="#8b5cf6"/><rect x="676" y="169" width="13" height="13" fill="#8b5cf6"/><rect x="689" y="169" width="13" height="13" fill="#8b5cf6"/><rect x="702" y="169" width="13" height="13" fill="#8b5cf6"/><rect x="715" y="169" width="13" height="13" fill="#8b5cf6"/><rect x="728" y="169" width="13" height="13" fill="#8b5cf6"/><rect x="741" y="169" width="13" height="13" fill="#8b5cf6"/><rect x="754" y="169